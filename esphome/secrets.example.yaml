# Copy to secrets.yaml (git-ignored) and fill in, or generate it with bin/make_secrets.sh.
wifi_ssid: "YourWiFi"
wifi_password: "..."
influx_host: "192.168.1.10"        # host running the InfluxDB add-on (your HA)

# one block per unit; keys must match the !secret names in noise-<unit>.yaml
indoor_api_key: "..."              # 32 random bytes, base64:  openssl rand -base64 32
indoor_ota_password: "..."
indoor_influx_auth: "Basic ..."    # printf 'esp:PASSWORD' | base64

outdoor_api_key: "..."
outdoor_ota_password: "..."
outdoor_influx_auth: "Basic ..."
