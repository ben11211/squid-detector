# noise-indoor - indoor unit
# Shared logic lives in noise-common.yaml; this file only sets identity and credentials.

substitutions:
  device_name: noise-indoor
  friendly_name: Noise Indoor
  location_tag: indoor         # tag on every InfluxDB point
  api_key: !secret indoor_api_key
  ota_password: !secret indoor_ota_password
  influx_host: !secret influx_host
  influx_auth: !secret indoor_influx_auth   # "Basic <base64 user:password>"

packages:
  common: !include noise-common.yaml
